---
- name: Update NixOS-based virtual machines
  hosts: localhost
  connection: local
  tasks:
    - name: Set initial list of VMs to process
      ansible.builtin.set_fact:
        default_host_list: "{{ groups['nixos_hosts'] }}"
    - name: Set final list of VMs to process
      ansible.builtin.set_fact:
        final_host_list: >-
          {{
            (target_host_names | default('') | split(',') | reject('equalto', '') | list)
            | default(host_list, true)
            | difference(exclude_host_names | default('') | split(',') | reject('equalto', '') | list)
          }}
    - name: Load NixOS-specific configuration file
      ansible.builtin.include_vars:
        file: "../../group_vars/nixos_vms.yaml"
    - name: Create directory for logs from nixos-rebuild
      ansible.builtin.file:
        path: "../../tmp-logs"
        state: directory
    - name: Update each VM # This is the main guts of our logic here
      include_tasks: internal-loop.yaml
      loop: "{{ final_host_list }}"
      loop_control:
        loop_var: host_file
