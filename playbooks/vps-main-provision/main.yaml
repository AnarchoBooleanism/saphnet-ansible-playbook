---
- name: Provision main (Debian-based) VPS servers
  hosts: localhost
  connection: local
  tasks:
    - name: Set initial list of VPSes to process
      ansible.builtin.set_fact:
        host_list: "{{ groups['vps_main'] }}"
    - name: Set final list of hosts to process
      ansible.builtin.set_fact:
        final_host_list: >-
          {{
            (target_host_names | default('') | split(',') | reject('equalto', '') | list)
            | default(default_host_list, true)
            | difference(exclude_host_names | default('') | split(',') | reject('equalto', '') | list)
          }}
    # NOTE: Before running this script for your VPS, make sure it has the right SSH key and password set for root!
    - name: Dynamically create/update each VPS # This is the main guts of our logic here
      include_tasks: internal-loop.yaml
      loop: "{{ final_host_list }}"
      loop_control:
        loop_var: host_file
